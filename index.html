<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Le Truc Atelier</title>
		<link rel="stylesheet" href="/src/styles/main.css">
		<script type="module" src="/src/main.ts"></script>
	</head>
	<body>
		<header>
			<h1>Le Truc Atelier</h1>
		</header>
		<!-- module-listnav syncs the component tree with the URL hash and loads
			the selected component into the editor area via module-lazyload -->
		<module-listnav>
			<module-splitview id="workspace" split="0.2">
				<module-scrollarea>
					<nav aria-labelledby="components-label">
						<h2 id="components-label">Components</h2>
						<form-listbox id="components">
							<input type="hidden" name="component">
							<div role="listbox" aria-labelledby="components-label">
								<!-- biome-ignore lint/a11y/useSemanticElements: ARIA listbox pattern per le-truc form-listbox -->
								<div role="group" aria-labelledby="components-group-demo">
									<div role="presentation" id="components-group-demo">
										Demo
									</div>
									<button
										type="button"
										role="option"
										tabindex="0"
										value="./partials/demo-greeter.html"
										aria-selected="true"
									>
										demo-greeter
									</button>
								</div>
							</div>
						</form-listbox>
					</nav>
				</module-scrollarea>
				<!-- biome-ignore lint/a11y/useSemanticElements: interactive separator per le-truc module-splitview -->
				<button
					type="button"
					class="divider"
					role="separator"
					aria-label="Resize component tree"
					aria-orientation="horizontal"
					aria-valuenow="20"
					aria-valuemin="10"
					aria-valuemax="90"
				></button>
				<module-splitview id="editors" split="0.7">
					<module-scrollarea>
						<module-component-editor>
							<module-lazyload>
								<card-callout>
									<p class="loading" role="status">Loading…</p>
									<p class="error" role="alert" aria-live="assertive" hidden>
									</p>
								</card-callout>
								<div class="content" hidden></div>
							</module-lazyload>
						</module-component-editor>
					</module-scrollarea>
					<!-- biome-ignore lint/a11y/useSemanticElements: interactive separator per le-truc module-splitview -->
					<button
						type="button"
						class="divider"
						role="separator"
						aria-label="Resize editor and properties"
						aria-orientation="horizontal"
						aria-valuenow="70"
						aria-valuemin="10"
						aria-valuemax="90"
					></button>
					<module-scrollarea>
						<module-properties-editor>
							<section>
								<h2>demo-greeter</h2>
								<h3>Reactive properties</h3>
								<dl>
									<dt>subject</dt>
									<dd>string</dd>
								</dl>
							</section>
							<section>
								<h3>Addressed descendants</h3>
								<dl>
									<dt>output</dt>
									<dd>
										<code>selector: "output"</code> — required: Needed to
										display the greeting.
									</dd>
									<dt>input</dt>
									<dd>
										<code>selector: "input"</code> — required: Needed to
										enter whom to greet.
									</dd>
								</dl>
							</section>
						</module-properties-editor>
					</module-scrollarea>
				</module-splitview>
			</module-splitview>
		</module-listnav>
	</body>
</html>
